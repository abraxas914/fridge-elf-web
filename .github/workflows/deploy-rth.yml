name: Deploy Retinbox mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-retinbox-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: shangzheny/rth-host-helper:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Retinbox Web Hosting
        run: deno -Ar https://host.retiehe.com/cli deploy
        env:
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
